server.port=8090
# Uncomment in production
# spring.devtools.add-properties=false
logging.level.web=DEBUG
# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sport_events?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT
jwt.secret=change-me-in-env
jwt.header=Authorization
jwt.prefix=Bearer
# 1 hour
jwt.access_token.expiration_ms=3600000
# 30 days
jwt.refresh_token.expiration_ms=86400000

